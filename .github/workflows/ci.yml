name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  box:
    # The tests marked `box` read the runner's own files and skip themselves
    # where a directory is absent, which keeps them honest on a laptop. On a
    # runner there is nothing to skip, and a silent skip here would take the
    # only tests against inputs we did not write out of the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"

      - name: no box test skipped itself
        run: |
          set -euo pipefail
          # `-q` once, which is all it takes now that pyproject.toml does not
          # also pass it. Two of them suppress the summary line these greps
          # read, which is how the first version of this job failed while every
          # test passed.
          pytest -q -rs -m box | tee box.txt
          if grep -qiF 'skipped' box.txt; then
            echo 'a box test skipped itself -- the runner image lost a directory' >&2
            exit 1
          fi
          # A leading non-zero count, so this cannot pass on zero box tests.
          grep -qE '^[1-9][0-9]* passed' box.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  dogfood:
    # The README quotes this. If the example or the tool changes, this is the
    # job that notices before a reader does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      - name: the shipped example passes and says what the README says
        run: |
          set -euo pipefail
          stockbox run -c examples/corpus.toml | tee out.txt
          grep -qF 'every floor met, nothing broken' out.txt
          for shape in 'json:' 'shell:' 'json-descriptions:' 'workflow-trees:'; do
            grep -qF "$shape" out.txt
          done
          grep -qF 'floor of 40 verdicts: met' out.txt
          grep -qF 'floor of 10 verdicts: met' out.txt
          # Counts move with the runner image, so assert the shape of the
          # result rather than the numbers: nothing declined, nothing broken.
          grep -qE 'declined 0 +broken 0 +soundness 0' out.txt

      - name: a names pattern with a directory in it, and {tree}
        run: |
          set -euo pipefail
          # `test -d {tree}/.github` is the assertion: 0 only where {tree} is
          # the directory holding .github, and 1 -- undeclared, so broken, so
          # exit 3 -- anywhere it is not. Nothing here can pass vacuously.
          cat > trees.toml <<'TOML'
          [[shape]]
          name = "workflow-trees"
          roots = [
              "/usr/lib/google-cloud-sdk/platform",
              "/usr/local/lib/node_modules",
              "/etc/skel/.nvm",
              "/usr/local/share/vcpkg",
              "/usr/share/miniconda/pkgs",
          ]
          names = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
          command = ["test", "-d", "{tree}/.github"]
          verdict = [0]
          sample = false
          min_verdicts = 10
          TOML
          stockbox run -c trees.toml --json > trees.json
          stockbox run -c trees.toml | tee trees.txt
          grep -qE 'candidates in [0-9]+ trees' trees.txt
          grep -qF 'build a command line another input already builds' trees.txt
          python3 -c "
          import json
          s = json.load(open('trees.json'))['shapes'][0]
          # Every number read off the image, so an image bump moves them and
          # none of these asserts one. What is asserted is that the corpus the
          # old basename matching could not express is there, and is counted by
          # tree.
          assert s['candidates'] > s['trees'] > 10, s
          assert s['distinct'] == s['trees'], s
          assert s['collapsed'] == s['candidates'] - s['trees'], s
          assert s['verdicts'] == s['distinct'], 'a {tree} was not a project root'
          assert s['broken'] == 0 and s['broken_inputs'] == [], s
          print(f\"{s['candidates']} files, {s['trees']} trees, all {s['verdicts']} verdicts\")
          "

          # The spelling that used to be the only one available finds an order
          # of magnitude more of the wrong thing. This is the bug, measured.
          sed 's|".github/workflows/\*|"*|g' trees.toml > loose.toml
          stockbox roots -c loose.toml --json > loose.json
          python3 -c "
          import json
          tight = json.load(open('trees.json'))['shapes'][0]['candidates']
          loose = json.load(open('loose.json'))['shapes'][0]['candidates']
          assert loose > tight * 5, (loose, tight)
          print(f'{tight} workflow files among {loose} *.yml')
          "

      # Quoted: a plain scalar starting with `*` is a YAML alias, and the whole
      # file fails to parse. GitHub would have reported that as the workflow
      # not existing.
      - name: '`**` in a names pattern is rejected rather than half-working'
        run: |
          set -euo pipefail
          cat > stars.toml <<'TOML'
          [[shape]]
          name = "stars"
          roots = ["/etc"]
          names = [".github/**/*.yml"]
          command = ["true", "{path}"]
          min_verdicts = 1
          TOML
          stockbox run -c stars.toml 2> stars.err && s=0 || s=$?
          cat stars.err
          test "$s" -eq 2
          grep -qF '`**` is not a wildcard here' stars.err

      - name: the README's own claim -- a met verdict floor on a vacuous corpus
        run: |
          set -euo pipefail
          # `json-descriptions` is in the shipped example so the headline
          # sentence of the README is something CI runs. The numbers move with
          # the image; the gap between them is what gets asserted.
          stockbox run -c examples/corpus.toml --json > ex.json
          python3 -c "
          import json
          s = next(s for s in json.load(open('ex.json'))['shapes']
                   if s['name'] == 'json-descriptions')
          assert s['floor_met'] is True, s
          assert s['measurement_failed'] is False, 'the pattern read no count'
          assert s['exercise_floor_met'] is True, s
          assert 0 < s['exercised'] < s['verdicts'], s
          assert s['vacuous'] > s['exercised'], s
          assert s['exercised'] + s['vacuous'] + s['unmeasured'] == s['verdicts'], s
          print(f\"{s['exercised']} of {s['verdicts']} verdicts exercised\")
          "

      - name: a vacuous corpus fails although every input got a verdict
        run: |
          set -euo pipefail
          # The failure the exercised floor exists for. awk exits 0 on every
          # file it can read, so the verdict floor is met by construction and
          # the only thing left that can fail is the count awk prints.
          cat > vacuous.toml <<'TOML'
          [[shape]]
          name = "nothing-in-them"
          roots = ["/usr/lib/python3"]
          names = ["*.json"]
          command = ["awk", '/no-json-file-has-this-key/ { n++ } END { print n+0 " hits" }', "{path}"]
          verdict = [0]
          declined = [2]
          sample = 20
          min_verdicts = 10
          subject_pattern = '^([0-9]+) hits$'
          min_exercised = 1
          TOML
          stockbox run -c vacuous.toml > vacuous.txt && s=0 || s=$?
          cat vacuous.txt
          test "$s" -eq 1
          grep -qF 'floor of 10 verdicts: met' vacuous.txt
          grep -qF 'floor of 1 exercised: NOT MET' vacuous.txt
          grep -qF 'held none of what it is about' vacuous.txt
          grep -qF 'Corpus too thin' vacuous.txt

      - name: a subject_pattern that matches nothing is broken, not thin
        run: |
          set -euo pipefail
          # Exit 3, and no advice about roots: silence from the pattern is
          # evidence about the pattern, not about the corpus.
          cat > unmeasured.toml <<'TOML'
          [[shape]]
          name = "wrong-pattern"
          roots = ["/usr/lib/python3"]
          names = ["*.json"]
          command = ["awk", 'END { print NR " lines" }', "{path}"]
          verdict = [0]
          sample = 20
          min_verdicts = 10
          subject_pattern = '^([0-9]+) sprockets$'
          min_exercised = 1
          TOML
          stockbox run -c unmeasured.toml > unmeasured.txt && s=0 || s=$?
          cat unmeasured.txt
          test "$s" -eq 3
          grep -qF 'exercised: not measured' unmeasured.txt
          grep -qF 'This says nothing about the corpus' unmeasured.txt
          grep -qF 'Not measured: the subject_pattern for wrong-pattern' unmeasured.txt
          # `! grep ...` would read as the assertion and could never fail it:
          # set -e ignores a pipeline inverted with `!`, which is the whole
          # reason the box job above spells its absence check as an `if`.
          if grep -qF 'held none of what it is about' unmeasured.txt; then
            echo 'advice about the corpus, when nothing was measured' >&2
            exit 1
          fi

      - name: an awk program in a command is not a traceback
        run: |
          set -euo pipefail
          # This was `KeyError: ' n++ '` from the middle of the corpus walk:
          # substitution read the whole argument as a format string. Braces
          # that are not placeholders belong to the checker.
          cat > braces.toml <<'TOML'
          [[shape]]
          name = "awk"
          roots = ["/usr/lib/python3"]
          names = ["*.json"]
          command = ["awk", 'END { print NR " lines" }', "{path}"]
          verdict = [0]
          sample = 5
          min_verdicts = 5
          subject_pattern = '^([0-9]+) lines$'
          TOML
          stockbox run -c braces.toml | tee braces.txt
          if grep -qF 'Traceback' braces.txt; then
            echo 'the awk program came back out as a traceback again' >&2
            exit 1
          fi
          grep -qF 'floor of 5 verdicts: met' braces.txt
          grep -qE 'exercised [0-9]+ of 5 verdicts' braces.txt

          # And a brace-wrapped word that looks like a placeholder and is not.
          sed 's/{path}/{pathh}/' braces.toml > typo.toml
          stockbox run -c typo.toml 2> typo.err && s=0 || s=$?
          cat typo.err
          test "$s" -eq 2
          grep -qF 'which is no placeholder' typo.err

      - name: roots reports per-root counts without running anything
        run: |
          set -euo pipefail
          stockbox roots -c examples/corpus.toml | tee roots.txt
          grep -qF '/usr/lib/python3' roots.txt
          grep -qE 'json: [0-9]+ candidates' roots.txt

      - name: --dry-run runs nothing
        run: |
          set -euo pipefail
          stockbox run -c examples/corpus.toml --dry-run | tee dry.txt
          grep -qF 'Nothing was run' dry.txt
          grep -qF 'json.tool' dry.txt

      - name: a corpus the checker declines fails, and says it tested nothing
        run: |
          set -euo pipefail
          # The measured case the tool exists for, reproduced with a checker
          # that is always on the box: `false` declines every input it is
          # given, so the corpus is real and the verdict count is zero.
          cat > declined.toml <<'TOML'
          [[shape]]
          name = "all-declined"
          roots = ["/usr/share/doc"]
          names = ["*.json"]
          command = ["false", "{path}"]
          verdict = [0]
          declined = [1]
          min_verdicts = 1
          TOML
          stockbox run -c declined.toml > declined.txt && s=0 || s=$?
          cat declined.txt
          test "$s" -eq 1
          grep -qF 'NOT MET' declined.txt
          grep -qF 'Every input was declined' declined.txt
          grep -qF 'Corpus too thin' declined.txt

      - name: an undeclared exit code is broken, and beats a met floor
        run: |
          set -euo pipefail
          # 42 is declared as neither a verdict nor declined, so every input
          # lands in broken and the unmet floor is reported but not the exit.
          cat > broken.toml <<'TOML'
          [[shape]]
          name = "undeclared"
          roots = ["/usr/share/doc"]
          names = ["*.json"]
          command = ["sh", "-c", "exit 42", "--", "{path}"]
          verdict = [0]
          min_verdicts = 1
          TOML
          stockbox run -c broken.toml > broken.txt && s=0 || s=$?
          cat broken.txt
          test "$s" -eq 3
          grep -qF 'exit 42' broken.txt
          grep -qF 'reproduce:' broken.txt
          grep -qF 'broke the checker' broken.txt

      - name: a corpus file that asserts nothing is rejected
        run: |
          set -euo pipefail
          # A floor of zero and an empty file are both "green for free", which
          # is the failure this tool exists to catch. Neither is accepted.
          printf '' > empty.toml
          stockbox run -c empty.toml 2> empty.err && s=0 || s=$?
          cat empty.err
          test "$s" -eq 2
          grep -qF 'no [[shape]] tables' empty.err

          cat > zero.toml <<'TOML'
          [[shape]]
          name = "zero"
          roots = ["/usr/share/doc"]
          names = ["*.json"]
          command = ["true", "{path}"]
          min_verdicts = 0
          TOML
          stockbox run -c zero.toml 2> zero.err && s=0 || s=$?
          cat zero.err
          test "$s" -eq 2
          grep -qF 'floor of zero asserts' zero.err

      - name: --json is valid JSON and carries the exit
        run: |
          set -euo pipefail
          stockbox run -c examples/corpus.toml --json > out.json
          python3 -c "
          import json
          d = json.load(open('out.json'))
          assert d['exit'] == 0, d['exit']
          assert d['verdicts'] >= 50, d['verdicts']
          names = {s['name'] for s in d['shapes']}
          assert names == {'json', 'shell', 'json-descriptions', 'workflow-trees'}, names
          for s in d['shapes']:
              assert s['floor_met'] is True, s
              assert s['exercise_floor_met'] is True, s
              assert s['measurement_failed'] is False, s
              assert s['broken_inputs'] == [], s
          # Only the shape that declared a pattern contributes, so this is not
          # the verdict total and must not drift into being it.
          assert 0 < d['exercised'] < d['verdicts'], (d['exercised'], d['verdicts'])
          print('json ok')
          "
